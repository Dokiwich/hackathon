name: CI Verification (4 Tracks)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tracks:
    name: Frontend Lint, Test, Build & Audit (${{ matrix.track }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        track:
          - de-1-so-tay-chi-doan
          - de-2-tai-mat-cong-dan
          - de-3-ocop-len-san
          - de-4-chong-lua-101

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.track }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.track }}
        run: npm ci

      - name: Lint code
        working-directory: ${{ matrix.track }}
        run: npm run lint

      - name: Run unit tests
        working-directory: ${{ matrix.track }}
        run: npm test

      - name: Build production bundle
        working-directory: ${{ matrix.track }}
        run: npm run build

      - name: Production dependency audit (strict)
        working-directory: ${{ matrix.track }}
        run: npm audit --omit=dev --audit-level=high

      - name: Dev dependency audit (advisory report)
        working-directory: ${{ matrix.track }}
        run: npm audit --audit-level=high || echo "::warning::Dev dependency audit reported advisories in ${{ matrix.track }}."

  verify-backends:
    name: Backend Lint, Test & Audit (${{ matrix.track }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        track:
          - de-1-so-tay-chi-doan
          - de-2-tai-mat-cong-dan
          - de-3-ocop-len-san
          - de-4-chong-lua-101

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.track }}/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ${{ matrix.track }}/backend
        run: npm ci

      - name: Lint backend (layer & module boundaries)
        working-directory: ${{ matrix.track }}/backend
        run: npm run lint

      - name: Run backend contract tests
        working-directory: ${{ matrix.track }}/backend
        run: npm test

      - name: Production dependency audit (strict)
        working-directory: ${{ matrix.track }}/backend
        run: npm audit --omit=dev --audit-level=high
