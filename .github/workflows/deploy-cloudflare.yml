name: Deploy Selected App to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      app:
        description: Select track folder to deploy
        required: true
        default: de-2-tai-mat-cong-dan
        type: choice
        options:
          - de-1-so-tay-chi-doan
          - de-2-tai-mat-cong-dan
          - de-3-ocop-len-san
          - de-4-chong-lua-101
      production:
        description: Deploy to production branch (main -> *.pages.dev)
        required: true
        default: true
        type: boolean
      project_name:
        description: Optional Cloudflare Pages project name (defaults to selected folder)
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  deploy-cloudflare-pages:
    name: Build & Deploy ${{ inputs.app }} to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ inputs.app }}/package-lock.json

      - name: Validate Cloudflare secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi

      - name: Install, Lint, Test & Build
        working-directory: ${{ inputs.app }}
        env:
          VITE_BASE_PATH: /
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_DIR: ${{ inputs.app }}
          CUSTOM_PROJECT: ${{ inputs.project_name }}
          BRANCH_FLAG: ${{ inputs.production && '--branch=main' || '--branch=preview' }}
        run: |
          PROJECT="${CUSTOM_PROJECT:-$APP_DIR}"
          npx --yes wrangler@latest pages project create "$PROJECT" --production-branch=main >/dev/null 2>&1 || true
          npx --yes wrangler@latest pages deploy "${APP_DIR}/dist" --project-name="$PROJECT" $BRANCH_FLAG
