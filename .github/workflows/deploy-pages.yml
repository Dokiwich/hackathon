name: Deploy 4-Track Hub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build 4 Standalone Apps & Portal Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies for all 4 tracks
        run: |
          npm --prefix de-1-so-tay-chi-doan ci
          npm --prefix de-2-tai-mat-cong-dan ci
          npm --prefix de-3-ocop-len-san ci
          npm --prefix de-4-chong-lua-101 ci

      - name: Build Hub & 4 apps with repository subpath
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          export VITE_BASE_PATH="/${REPO_NAME}/"
          node scripts/build-all-pages.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-pages

  deploy:
    name: Publish GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
